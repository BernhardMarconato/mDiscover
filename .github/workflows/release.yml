name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build signed Store bundle & create release
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract release version
        id: get_version
        shell: pwsh
        run: |
          $rawTag = "${{ github.event.inputs.tag_name || github.ref_name }}"
          $version = $rawTag.TrimStart('v')
          Write-Output "VERSION=$version" >> $env:GITHUB_OUTPUT
          Write-Output "TAG=$rawTag" >> $env:GITHUB_OUTPUT
          Write-Host "Building release for version: $version (Tag: $rawTag)"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore mDiscover.slnx -p:Configuration=Release

      - name: Run unit tests
        run: dotnet test mDiscover.Tests/mDiscover.Tests.csproj -c Release -p:Platform=x64

      - name: Build multi-architecture Store MSIX bundle (x64 + ARM64)
        run: |
          dotnet build mDiscover/mDiscover.csproj `
            -c Release `
            -p:Platform=x64 `
            -p:AppxBundlePlatforms="x64|ARM64" `
            -p:AppxBundle=Always `
            -p:UapAppxPackageBuildMode=StoreUpload `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageDir="${{ github.workspace }}\AppxPackages\" `
            -p:Version=${{ steps.get_version.outputs.VERSION }} `
            --verbosity minimal

      - name: Upload Store upload package (.msixupload)
        uses: actions/upload-artifact@v4
        with:
          name: mDiscover-${{ steps.get_version.outputs.TAG }}-StorePackage
          path: ${{ github.workspace }}\AppxPackages\*.msixupload

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_version.outputs.TAG }}
          name: mDiscover ${{ steps.get_version.outputs.TAG }}
          generate_release_notes: true
          draft: false
          prerelease: false
